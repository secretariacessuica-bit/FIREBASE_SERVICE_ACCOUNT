<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Bridge</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
        }
        #unity-container {
            width: 100%;
            height: 100%;
        }
        #unity-canvas {
            width: 100%;
            height: 100%;
            background: transparent;
        }
    </style>
</head>
<body>
    <div id="unity-container">
        <canvas id="unity-canvas"></canvas>
    </div>
    <script>
        // Configuração padrão de carregamento do Unity WebGL build
        var buildUrl = "unity_build/Build"; 
        var loaderUrl = buildUrl + "/unity_build.loader.js";
        var config = {
            dataUrl: buildUrl + "/unity_build.data",
            frameworkUrl: buildUrl + "/unity_build.framework.js",
            codeUrl: buildUrl + "/unity_build.wasm",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "Oikos",
            productName: "OikosAvatar",
            productVersion: "1.0",
        };

        var canvas = document.querySelector("#unity-canvas");
        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
            createUnityInstance(canvas, config, (progress) => {
                // Progresso opcional
            }).then((unityInstance) => {
                window.unityInstance = unityInstance;
            }).catch((message) => {
                console.error("Erro ao instanciar o Unity: " + message);
            });
        };
        document.body.appendChild(script);

        // Função de ponte chamada pelo OikosPlugin.jslib
        window.onAvatarClick = function(memberId) {
            window.parent.postMessage({
                type: 'UNITY_MEMBER_SELECTED',
                memberId: memberId
            }, '*');
        };

        // Escuta mensagens do Flutter
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'FLUTTER_UPDATE_AVATARS') {
                if (window.unityInstance) {
                    var avatarsJson = JSON.stringify(event.data.avatars);
                    window.unityInstance.SendMessage('AvatarManager', 'UpdateAvatarsFromFlutter', avatarsJson);
                }
            }
        });
    </script>
</body>
</html>
