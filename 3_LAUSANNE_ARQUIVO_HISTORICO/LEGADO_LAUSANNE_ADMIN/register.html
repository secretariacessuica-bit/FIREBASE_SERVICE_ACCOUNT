<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto-Cadastro | Catedral Lausanne</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="js/firebase-config.js?v=71.2.0"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --gold: #C9A050;
            --bg: #ffffff;
            --text: #1a1a1a;
            --font: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: var(--font);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        .logo { width: 120px; margin-bottom: 30px; }
        
        .card {
            width: 100%;
            max-width: 450px;
            background: #fff;
            padding: 30px;
            border-radius: 30px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.08);
            border: 1px solid #f0f0f0;
        }

        h1 { font-weight: 800; font-size: 1.8rem; margin-bottom: 10px; text-align: center; }
        p { color: #666; text-align: center; margin-bottom: 30px; line-height: 1.5; }

        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 800; font-size: 0.75rem; text-transform: uppercase; color: var(--gold); margin-bottom: 8px; letter-spacing: 1px; }
        input, select {
            width: 100%; padding: 16px; border-radius: 15px; border: 1.5px solid #eee;
            background: #f8fafc; font-family: inherit; font-size: 1rem; font-weight: 600;
            box-sizing: border-box; outline: none; transition: 0.3s;
        }
        input:focus { border-color: var(--gold); background: #fff; }

        .btn-submit {
            width: 100%; padding: 18px; background: var(--gold); border: none; border-radius: 18px;
            color: #000; font-weight: 800; font-size: 1rem; cursor: pointer; text-transform: uppercase;
            letter-spacing: 1px; margin-top: 10px; box-shadow: 0 10px 20px rgba(201, 160, 80, 0.2);
            transition: 0.3s;
        }
        .btn-submit:active { transform: scale(0.98); }

        .success-overlay {
            position: fixed; inset: 0; background: #fff; z-index: 100;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 40px;
        }
        .success-overlay i { font-size: 5rem; color: #10b981; margin-bottom: 20px; }
    </style>
</head>
<body>
    <img src="assets/logo_3.png" class="logo" alt="Lausanne">
    
    <div class="card" id="reg-form">
        <h1>Seja bem-vindo!</h1>
        <p>Ficamos felizes com sua presença. Por favor, preencha seus dados para mantermos contato.</p>
        
        <div class="form-group">
            <label>Nome Completo</label>
            <input type="text" id="name" placeholder="Seu nome...">
        </div>
        
        <div class="form-group">
            <label>WhatsApp</label>
            <div style="display:flex; gap:10px;">
                <select id="ddi" style="width:100px;">
                    <option value="+41">CH +41</option>
                    <option value="+33">FR +33</option>
                    <option value="+55">BR +55</option>
                    <option value="+351">PT +351</option>
                </select>
                <input type="tel" id="phone" placeholder="Seu número..." style="flex:1;">
            </div>
        </div>

        <div class="form-group">
            <label>Você já tem uma igreja?</label>
            <select id="has-church">
                <option value="sim">Sim</option>
                <option value="nao">Não, estou visitando</option>
            </select>
        </div>

        <button class="btn-submit" onclick="submitRegistration()">Enviar Cadastro</button>
    </div>

    <div class="success-overlay" id="success">
        <i class="fas fa-check-circle"></i>
        <h1>Cadastro Realizado!</h1>
        <p>Obrigado por se registrar. Em breve nossa equipe entrará em contato com você.</p>
        <button class="btn-submit" onclick="window.location.reload()" style="max-width:200px;">Voltar</button>
    </div>

    <script>
        const db = firebase.firestore();

        async function submitRegistration() {
            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;
            const ddi = document.getElementById('ddi').value;
            const hasChurch = document.getElementById('has-church').value;

            if(!name || !phone) return alert("Por favor, preencha seu nome e telefone.");

            const fullPhone = ddi + " " + phone.replace(/\D/g, '');

            try {
                const batch = db.batch();
                
                // 1. Add to integration queue
                const refInt = db.collection('integracao').doc();
                batch.set(refInt, {
                    name: name,
                    contact: fullPhone,
                    type: 'visitante',
                    status: 'pending_integracao',
                    origin: 'self_registration_online',
                    has_church: hasChurch === 'sim',
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });

                // 2. Add to attendance for Altar visibility
                const refAtt = db.collection('attendance').doc();
                batch.set(refAtt, {
                    name: name,
                    type: 'visitante',
                    detail: 'Auto-Cadastro Online',
                    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                    origin: 'self_registration'
                });

                await batch.commit();
                
                document.getElementById('reg-form').style.display = 'none';
                document.getElementById('success').style.display = 'flex';
                
            } catch(e) {
                alert("Erro ao enviar: " + e.message);
            }
        }
    </script>
</body>
</html>
