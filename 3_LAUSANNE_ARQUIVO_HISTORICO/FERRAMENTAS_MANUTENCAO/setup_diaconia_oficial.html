<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>⚙️ Setup Oficial — CES Diaconia Lausanne</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Courier New', monospace; background: #0d1117; color: #c9d1d9; padding: 30px; min-height: 100vh; }
        h1 { color: #58a6ff; font-size: 1.4rem; margin-bottom: 6px; }
        .subtitle { color: #8b949e; font-size: 0.85rem; margin-bottom: 30px; }
        #terminal {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 20px;
            font-size: 0.88rem;
            line-height: 1.7;
            min-height: 200px;
            white-space: pre-wrap;
        }
        .ok   { color: #3fb950; }
        .warn { color: #d29922; }
        .err  { color: #f85149; }
        .info { color: #58a6ff; }
        .head { color: #e3b341; font-weight: bold; }
        .done { color: #3fb950; font-weight: bold; font-size: 1.1em; }
        #tabela {
            margin-top: 30px;
            width: 100%;
            border-collapse: collapse;
            display: none;
        }
        #tabela th {
            background: #21262d;
            color: #58a6ff;
            padding: 10px 16px;
            text-align: left;
            border-bottom: 2px solid #30363d;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        #tabela td {
            padding: 10px 16px;
            border-bottom: 1px solid #21262d;
            font-size: 0.9rem;
        }
        #tabela tr:hover td { background: #161b22; }
        .badge-admin  { background: #1f3a5c; color: #58a6ff; padding: 2px 10px; border-radius: 20px; font-size: 0.78rem; font-weight: bold; }
        .badge-membro { background: #1a3a2a; color: #3fb950; padding: 2px 10px; border-radius: 20px; font-size: 0.78rem; }
        .badge-inativo { background: #3a1a1a; color: #f85149; padding: 2px 10px; border-radius: 20px; font-size: 0.78rem; }
        h2 { color: #c9d1d9; font-size: 1.1rem; margin: 25px 0 12px; }
        .senha-box { font-family: monospace; background: #21262d; padding: 2px 8px; border-radius: 4px; color: #e3b341; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body>
    <h1>⚙️ Setup Oficial — CES Diaconia Lausanne</h1>
    <p class="subtitle">Lendo Firestore → atualizando senhas → gerando tabela de acesso</p>

    <div id="terminal">Aguardando Firebase...</div>

    <h2 id="tabela-titulo" style="display:none;">📋 Tabela de Acesso dos Membros</h2>
    <table id="tabela">
        <thead>
            <tr>
                <th>#</th>
                <th>Nome</th>
                <th>Perfil</th>
                <th>Setor</th>
                <th>Função</th>
                <th>Senha</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="tabela-body"></tbody>
    </table>

    <script>
        const SENHA_ADMIN   = 'Ces120222.';
        const SENHA_MEMBROS = 'ces2025';
        const COLECAO       = 'diaconia_escala_membros';

        const firebaseConfig = {
            apiKey: "AIzaSyAtwHODax7kq0keaLuON1ZxbNfdaBP7yfo",
            authDomain: "catedral-connect-267b2.firebaseapp.com",
            projectId: "catedral-connect-267b2",
            storageBucket: "catedral-connect-267b2.firebasestorage.app",
            messagingSenderId: "524359049819",
            appId: "1:524359049819:web:d4788e1c64767e0818557e"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const term = document.getElementById('terminal');
        term.textContent = '';

        function log(msg, cls = '') {
            const span = document.createElement('span');
            if (cls) span.className = cls;
            span.textContent = msg + '\n';
            term.appendChild(span);
        }

        function getSetorLabel(setor) {
            const map = {
                'diaconia_templo': 'Diaconia do Templo',
                'acolhimento_integracao': 'Acolhimento e Integração',
                'limpeza': 'Limpeza',
                'manutencao': 'Manutenção'
            };
            if (!setor) return '—';
            if (Array.isArray(setor)) return setor.map(s => map[s] || s).join(', ');
            return map[setor] || setor;
        }

        async function main() {
            log('🔗 Conectando ao Firestore...', 'info');
            log('📦 Coleção: ' + COLECAO + '\n', 'info');

            let snap;
            try {
                snap = await db.collection(COLECAO).orderBy('nome').get();
            } catch(e) {
                log('❌ Erro ao acessar Firestore: ' + e.message, 'err');
                return;
            }

            log(`👥 Total de membros encontrados: ${snap.size}\n`, 'head');

            if (snap.empty) {
                log('⚠️  Nenhum membro encontrado. O banco pode estar vazio.', 'warn');
                log('    Acesse o app uma vez para criar o Admin padrão.', 'warn');
                return;
            }

            const updates = [];
            const resumo  = [];

            snap.forEach(doc => {
                const d = doc.data();
                const nome   = d.nome   || '(sem nome)';
                const perfil = d.perfil || 'membro';
                const status = d.status || 'ativo';
                const setor  = d.setores || d.setor || null;
                const funcao = d.funcao  || '—';

                const novaSenha = (perfil === 'admin') ? SENHA_ADMIN : SENHA_MEMBROS;

                if (perfil === 'admin') {
                    log(`  [ADMIN]  ${nome.padEnd(36)} → ${novaSenha}`, 'info');
                } else {
                    log(`  [MEMBRO] ${nome.padEnd(36)} → ${novaSenha}`, 'ok');
                }

                updates.push(db.collection(COLECAO).doc(doc.id).update({ senha: novaSenha }));
                resumo.push({ nome, perfil, setor, funcao, senha: novaSenha, status });
            });

            log('\n⏳ Aplicando senhas no Firestore...', 'warn');

            try {
                await Promise.all(updates);
            } catch(e) {
                log('❌ Erro ao atualizar senhas: ' + e.message, 'err');
                return;
            }

            log('\n' + '═'.repeat(60), 'done');
            log('✅  CONCLUÍDO! Todas as senhas foram atualizadas.', 'done');
            log('═'.repeat(60) + '\n', 'done');
            log(`   Admin   → ${SENHA_ADMIN}`, 'info');
            log(`   Membros → ${SENHA_MEMBROS}\n`, 'ok');

            // Render table
            const tbody  = document.getElementById('tabela-body');
            const tabela = document.getElementById('tabela');
            const titulo = document.getElementById('tabela-titulo');

            resumo.forEach((r, i) => {
                const tr = document.createElement('tr');
                const badgePerfil = r.perfil === 'admin'
                    ? `<span class="badge-admin">Admin</span>`
                    : `<span class="badge-membro">Membro</span>`;
                const badgeStatus = r.status === 'ativo'
                    ? `<span class="badge-membro">Ativo</span>`
                    : `<span class="badge-inativo">Inativo</span>`;

                tr.innerHTML = `
                    <td style="color:#8b949e;">${i + 1}</td>
                    <td><strong>${r.nome}</strong></td>
                    <td>${badgePerfil}</td>
                    <td style="color:#8b949e; font-size:0.85rem;">${getSetorLabel(r.setor)}</td>
                    <td style="color:#8b949e; font-size:0.85rem;">${r.funcao}</td>
                    <td><span class="senha-box">${r.senha}</span></td>
                    <td>${badgeStatus}</td>
                `;
                tbody.appendChild(tr);
            });

            tabela.style.display = 'table';
            titulo.style.display = 'block';
        }

        main().catch(e => {
            log('\n❌ Erro inesperado: ' + e.message, 'err');
            console.error(e);
        });
    </script>
</body>
</html>
