<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Credenciais | Catedral Lausanne</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="../js/firebase-config.js"></script>
    <style>
        :root {
            --gold-primary: #D4AF37;
            --bg-dark: #0a0a0a;
            --card-bg: rgba(20, 20, 20, 0.95);
            --text-main: #ffffff;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 24px;
            padding: 40px;
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .logo {
            width: 80px;
            height: 80px;
            background: #fff;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid var(--gold-primary);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
        }

        h2 { font-weight: 800; letter-spacing: 1px; margin-bottom: 10px; color: var(--gold-primary); }
        p { color: #888; font-size: 0.9rem; margin-bottom: 30px; line-height: 1.5; }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #aaa;
            margin-bottom: 8px;
            margin-left: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        select, input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px;
            color: white;
            font-family: inherit;
            font-size: 1rem;
            box-sizing: border-box;
            transition: 0.3s;
        }

        select:focus, input:focus {
            border-color: var(--gold-primary);
            background: rgba(255, 255, 255, 0.08);
            outline: none;
        }

        .btn-reset {
            background: linear-gradient(135deg, #D4AF37 0%, #B8860B 100%);
            color: #000;
            border: none;
            padding: 16px;
            border-radius: 12px;
            width: 100%;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-reset:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(212, 175, 55, 0.2);
        }

        .btn-reset:disabled { opacity: 0.5; cursor: not-allowed; }

        #status {
            margin-top: 25px;
            font-size: 0.9rem;
            padding: 15px;
            border-radius: 12px;
            display: none;
            line-height: 1.4;
        }

        .status-success { background: rgba(16, 185, 129, 0.1); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.2); }
        .status-error { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.2); }

        .back-link {
            margin-top: 25px;
            display: block;
            color: #666;
            text-decoration: none;
            font-size: 0.85rem;
            transition: 0.3s;
        }
        .back-link:hover { color: var(--gold-primary); }

        /* AUTH GUARD OVERLAY */
        #auth-guard {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-dark); z-index: 9999;
            display: flex; align-items: center; justify-content: center;
            text-align: center; color: #ef4444;
        }
    </style>
</head>
<body>

    <div id="auth-guard">
        <div>
            <i class="fas fa-lock" style="font-size: 3rem; margin-bottom: 20px;"></i>
            <h3>ACESSO RESTRITO À SECRETARIA</h3>
            <p>Verificando credenciais administrativas...</p>
        </div>
    </div>

    <div class="container">
        <div class="card">
            <div class="logo">
                <i class="fas fa-key" style="color:var(--gold-primary); font-size: 1.8rem;"></i>
            </div>
            <h2>RESET DE SENHA</h2>
            <p>Utilize esta ferramenta para redefinir as credenciais de acesso de qualquer departamento.</p>

            <div class="form-group">
                <label>Departamento</label>
                <select id="role-select">
                    <option value="checkin@catedral.ch">Eventos (Check-in)</option>
                    <option value="recepcao@catedral.ch">Recepção</option>
                    <option value="infantil@catedral.ch">Kids (Infantil)</option>
                    <option value="missao@catedral.ch">Acolhimento / Conexões</option>
                    <option value="midia@catedral.ch">Altar / Mídia</option>
                </select>
            </div>

            <div class="form-group" id="bypass-container">
                <label>PIN Mestre (Autorização)</label>
                <input type="password" id="master-bypass" placeholder="Digite o PIN da Secretaria">
                <p style="font-size: 0.75rem; color: #ef4444; margin-top: 5px;">*Obrigatório caso não esteja logado.</p>
            </div>

            <button class="btn-reset" id="btn-submit" onclick="performReset()">SOLICITAR REDEFINIÇÃO</button>

            <div id="status"></div>

            <a href="../admin.html" class="back-link"><i class="fas fa-arrow-left"></i> Voltar ao Painel</a>
        </div>
    </div>

    <script>
        // --- AUTH GUARD v48.27.0 ---
        const MASTER_PIN = "Catedral@2025!";
        let isAuthorized = false;

        firebase.auth().onAuthStateChanged(user => {
            if (user) {
                const email = user.email.toLowerCase();
                if (email.includes('pastor') || email.includes('admin') || email.includes('master')) {
                    isAuthorized = true;
                    document.getElementById('auth-guard').style.display = 'none';
                }
            }
        });

        async function performReset() {
            const email = document.getElementById('role-select').value;
            const btn = document.getElementById('btn-submit');
            const status = document.getElementById('status');
            const bypass = document.getElementById('master-bypass').value;

            // EMERGENCY BYPASS: If not logged in but knows the Master PIN
            if (!isAuthorized && bypass !== MASTER_PIN) {
                showStatus("❌ ACESSO NEGADO: Use o PIN Mestre ou faça login na Secretaria.", "error");
                return;
            }

            btn.disabled = true;
            btn.innerText = "ENVIANDO...";

            try {
                await firebase.auth().sendPasswordResetEmail(email);
                showStatus(`✅ <strong>SUCESSO!</strong><br>O link de redefinição foi enviado para <strong>${email}</strong>.<br><br>Siga as instruções no e-mail para definir a nova senha.`, "success");
            } catch (err) {
                showStatus("❌ ERRO: " + err.message, "error");
            } finally {
                btn.disabled = false;
                btn.innerText = "SOLICITAR REDEFINIÇÃO";
            }
        }

        function showStatus(msg, type) {
            const status = document.getElementById('status');
            status.innerHTML = msg;
            status.style.display = 'block';
            status.className = type === 'success' ? 'status-success' : 'status-error';
        }
    </script>
</body>
</html>
