<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Connect | Catedral Lausanne</title>
    
    <!-- Premium Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --gold: #D4AF37;
            --gold-dark: #B8860B;
            --border-color: #d1d1d1;
            --btn-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Outfit', sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .watermark {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-25deg);
            font-size: 15vw;
            font-weight: 800;
            color: rgba(0, 0, 0, 0.035);
            white-space: nowrap;
            pointer-events: none;
            z-index: 1;
            letter-spacing: 12px;
            text-transform: uppercase;
        }

        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            padding: 20px;
            text-align: center;
        }

        .logo-circle {
            width: 140px;
            height: 140px;
            background: #ffffff;
            border: 1.5px solid var(--gold); /* Thin elegant gold frame */
            border-radius: 50%;
            margin: 0 auto 50px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.1); /* Soft gold glow */
            padding: 10px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .logo-circle:hover {
            transform: scale(1.05);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .btn-portal {
            background: #ffffff;
            border: 2px solid var(--border-color); /* Stronger border */
            border-radius: 16px;
            padding: 24px 10px;
            text-decoration: none;
            color: #1a1a1a;
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            box-shadow: var(--btn-shadow);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-portal:hover {
            border-color: var(--gold);
            color: var(--gold);
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(212, 175, 55, 0.2);
        }

        .btn-full {
            grid-column: span 2;
            border-color: var(--gold); /* Highlighted top border */
            color: var(--gold);
            background: rgba(212, 175, 55, 0.02);
        }

        .footer {
            position: fixed;
            bottom: 30px;
            width: 100%;
            text-align: center;
            font-size: 0.65rem;
            color: #aaa;
            letter-spacing: 3px;
            font-weight: 600;
            text-transform: uppercase;
            z-index: 10;
        }

        @media (max-width: 480px) {
            .logo-circle { width: 110px; height: 110px; }
            .btn-portal { padding: 20px 5px; font-size: 0.8rem; border-width: 1.5px; }
        }
    </style>
</head>
<body>

    <div class="watermark">CATEDRAL LAUSANNE</div>

    <div class="container">
        <div class="logo-circle">
            <img src="assets/logo.png" alt="Logo" style="width: 100%; height: 100%; object-fit: contain;">
        </div>

        <div class="grid">
            <a href="mobile.html?role=altar" class="btn-portal btn-full">
                LIVE (ALTAR)
            </a>

            <a href="mobile.html?role=reception" class="btn-portal">
                RECEPÇÃO
            </a>
            <a href="mobile.html?role=integracao" class="btn-portal">
                INTEGRAÇÃO
            </a>

            <a href="mobile.html?role=kids" class="btn-portal">
                CRIANÇAS
            </a>
            <a href="app.html" class="btn-portal">
                SECRETARIA
            </a>
        </div>
    </div>

    <div class="footer">Todos os direitos reservados para Grupo Bará(בָּרָא)</div>

</body>
</html>
