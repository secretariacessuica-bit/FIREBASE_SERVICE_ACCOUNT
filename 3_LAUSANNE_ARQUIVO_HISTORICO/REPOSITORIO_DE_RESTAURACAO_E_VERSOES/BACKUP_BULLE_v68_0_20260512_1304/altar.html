    <script>

        // --- INSTANT CONNECT v50.2 GOLD (Resilient Sync) ---
        var isInsideIframe = window.self !== window.top;

        async function fixFirestorePermissions() {
            const SW_VERSION = 'v48.12.8';
            const btn = event.target;
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> ATIVANDO...';

        function isWithinCurrentServiceWindow(dateObj) {
            if (!dateObj) return false;
            const now = new Date();
            const day = now.getDay();
            const hour = now.getHours();
            const d = new Date(dateObj);

            if (day === 0 || (day === 1 && hour < 22)) {
                let startOfShift = new Date(now);
                startOfShift.setDate(now.getDate() - (day === 1 ? 1 : 0));
                startOfShift.setHours(0, 0, 0, 0);
                let endOfShift = new Date(startOfShift);
                endOfShift.setDate(startOfShift.getDate() + 1);
                endOfShift.setHours(22, 0, 0, 0);
                return d >= startOfShift && d <= endOfShift;
            }
            if (day === 2 || (day === 3 && hour < 15)) {
                let startOfShift = new Date(now);
                startOfShift.setDate(now.getDate() - (day === 3 ? 1 : 0));
                startOfShift.setHours(0, 0, 0, 0);
                let endOfShift = new Date(startOfShift);
                endOfShift.setDate(startOfShift.getDate() + 1);
                endOfShift.setHours(15, 0, 0, 0);
                return d >= startOfShift && d <= endOfShift;
            }
            if ((day === 3 && hour >= 15) || day === 4) {
                let startOfShift = new Date(now);
                startOfShift.setDate(now.getDate() - (day === 4 ? 1 : 0));
                startOfShift.setHours(15, 0, 0, 0);
                let endOfShift = new Date(startOfShift);
                endOfShift.setDate(startOfShift.getDate() + 1);
                endOfShift.setHours(20, 59, 59, 999);
                return d >= startOfShift && d <= endOfShift;
            }
            if (day === 5 || (day === 6 && hour < 12)) {
                let startOfShift = new Date(now);
                startOfShift.setDate(now.getDate() - (day === 6 ? 1 : 0));
                startOfShift.setHours(0, 0, 0, 0);
                let endOfShift = new Date(startOfShift);
                endOfShift.setDate(startOfShift.getDate() + 1);
                endOfShift.setHours(12, 0, 0, 0);
                return d >= startOfShift && d <= endOfShift;
            }
            if (day === 6 && hour >= 14 && hour < 23) {
                let startOfShift = new Date(now);
                startOfShift.setHours(14, 0, 0, 0);
                let endOfShift = new Date(now);
                endOfShift.setHours(23, 0, 0, 0);
                return d >= startOfShift && d <= endOfShift;
            }
            let fallbackStart = new Date();
            fallbackStart.setHours(0, 0, 0, 0);
            return d >= fallbackStart;
        }

        let currentKidsCount = 0;
        let globalBirthdaysCount = 0;

        let timerSeconds = 0;
        let timerInterval = null;

        function updateTime() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
            // Update timer display
            const hours = Math.floor(timerSeconds / 3600);
            const minutes = Math.floor((timerSeconds % 3600) / 60);
            const seconds = timerSeconds % 60;
            document.getElementById('timer-display').innerText = 
                (hours > 0 ? String(hours).padStart(2, '0') + ':' : '') + 
                String(minutes).padStart(2, '0') + ':' + 
                String(seconds).padStart(2, '0');
        }

                    clearInterval(timerInterval);
                    timerInterval = null;
                    timerSeconds = 0;
                    updateTime();
                }
            } else {
                timerInterval = setInterval(() => {
                    timerSeconds++;
                    updateTime();
                }, 1000);
            }
        }
        setInterval(updateTime, 1000); updateTime();

        function initAltarMonitor() {
            console.log("Altar: Iniciando monitoramento de dados...");
            
            db.collection('attendance').orderBy('timestamp', 'desc').limit(100).onSnapshot(snap => {
                let stats = { visitors: 0, prayer: 0, kids: 0 };
                let html = { visitors: '', prayer: '', celebration: '' };

                snap.forEach(doc => {
                    const d = doc.data();
                    if (!d.timestamp) return;
                    const t = d.timestamp.toDate();
                    if (!isWithinCurrentServiceWindow(t)) return;

                    const time = t.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
                    const interests = Array.isArray(d.interests) ? d.interests : [];

                    if (d.type === 'visitante') {
                        stats.visitors++;
                        let details = d.extra || d.detail || 'Primeira Visita';
                        html.visitors += `<div class="list-item visitor-card"><div class="item-row"><span class="item-name">${d.name}</span><span class="item-time">${time}</span></div><span class="item-detail">${details}</span></div>`;
                    }
                    if (d.origin === 'reception_live_prayer') {
                        stats.prayer++;
                        html.prayer += `<div class="list-item"><div class="item-row"><span class="item-name">${d.name}</span><span class="item-time">${time}</span></div><span class="item-detail detail-prayer">${d.detail || d.obs || 'Pedido de Oração'}</span></div>`;
                    }
                    let celebs = [];
                    if (interests.some(i => i.includes('Batismo'))) { celebs.push('Batismo'); stats.kids++; }
                    if (interests.some(i => i.includes('Bebê')) || d.is_presentation || (d.detail && d.detail.includes('[BABY]'))) {
                        celebs.push('Apresentação'); stats.kids++;
                    }
                    if (d.type === 'convert' || interests.some(i => i.includes('Jesus'))) {
                        celebs.push('Nova Decisão'); stats.kids++;
                        // Trigger Supernova Celebration
                        if (!_knownDecisions.has(doc.id)) {
                            _knownDecisions.add(doc.id);
                            triggerCelebration(d.name || 'Alguém');
                        }
                    }

                    if (celebs.length > 0) {
                        let detailText = d.detail || '';
                        if (detailText.includes('[BABY]')) detailText = detailText.replace('[BABY]', '').trim();
                        const detailDisplay = detailText ? `<br><small style="color:rgba(255,255,255,0.5); font-weight:400;">${detailText}</small>` : '';
                        html.celebration += `<div class="list-item"><div class="item-row"><span class="item-name">${d.name}</span><span class="item-time">${time}</span></div><span class="item-detail detail-decision">${celebs.join(' + ')}${detailDisplay}</span></div>`;
                    }
                });

                document.getElementById('list-visitors').innerHTML = html.visitors || '<p style="text-align:center; opacity:0.3;">Nenhum visitante</p>';
                document.getElementById('list-prayer').innerHTML = html.prayer || '<p style="text-align:center; opacity:0.3;">Nenhum pedido</p>';
                document.getElementById('list-celebration').innerHTML = html.celebration || '<p style="text-align:center; opacity:0.3;">Sem celebração de hoje</p>';
                document.getElementById('count-visitors').innerText = stats.visitors;
                document.getElementById('count-prayer').innerText = stats.prayer;
                currentKidsCount = stats.kids;
                document.getElementById('count-baptism').innerText = currentKidsCount + globalBirthdaysCount;
            });

            db.collection('warnings').where('active', '==', true).limit(1).onSnapshot(snap => {
                const banner = document.getElementById('warning-banner');
                if (!snap.empty) {
                    document.getElementById('warning-text').innerText = snap.docs[0].data().message;
                    banner.style.display = 'block';
                } else { banner.style.display = 'none'; }
            });

            loadBirthdays();
        }

        function triggerCelebration(name, type = 'DECISÃO') {
            const overlay = document.body;
            overlay.classList.add('celebration-active');
            document.getElementById('celebration-text').innerHTML = `CELEBRAÇÃO:<br>${name.split(' ')[0]}<br><span style="font-size:2rem; opacity:0.8;">ACEITOU A JESUS!</span>`;
            
            // Confetti Blast
            const duration = 5 * 1000;
            const animationEnd = Date.now() + duration;
            const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 100000 };

            function randomInRange(min, max) {
              return Math.random() * (max - min) + min;
            }

            const interval = setInterval(function() {
              const timeLeft = animationEnd - Date.now();

              if (timeLeft <= 0) {
                return clearInterval(interval);
              }

              const particleCount = 50 * (timeLeft / duration);
              // since particles fall down, start a bit higher than random
              confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
              confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
            }, 250);

            setTimeout(() => {
                overlay.classList.remove('celebration-active');
            }, 6000);
        }

        let _knownDecisions = new Set();

        function loadBirthdays() {
            const now = new Date();
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            const matchToday = `${dd}/${mm}`;
            const monthTag = `/${mm}`;

            db.collection('people').get().then(snap => {
                let todayHtml = '<p style="font-size:0.9rem; color:var(--accent-pink); font-weight:800; text-transform:uppercase; margin-bottom:10px;"><i class="fas fa-star"></i> Aniversariantes de HOJE</p>';
                let monthHtml = '<p style="font-size:0.9rem; color:var(--gold-primary); font-weight:800; text-transform:uppercase; margin-top:20px; margin-bottom:10px;"><i class="fas fa-calendar-alt"></i> No Mês</p>';
                let todayCount = 0; let monthCount = 0;
                snap.forEach(doc => {
                    const d = doc.data();
                    const bday = d.data_nascimento || '';
                    if (!bday) return;
                    if (bday.startsWith(matchToday)) {
                        todayCount++;
                        todayHtml += `<div class="list-item" style="padding:15px; border-left:4px solid var(--accent-pink); background:rgba(236,72,153,0.1);"><div class="item-row"><span class="item-name" style="font-size:1.4rem; color:#fff;">${d.name || d.nome_completo}</span><span class="item-time" style="background:var(--accent-pink); color:#fff; border-radius:4px; padding:2px 6px;">HOJE!</span></div></div>`;
                    } else if (bday.includes(monthTag)) {
                        monthCount++;
                        monthHtml += `<div class="list-item" style="padding:12px; opacity:0.8;"><div class="item-row"><span class="item-name" style="font-size:1.1rem; color:#ccc;">${d.name || d.nome_completo}</span><span class="item-time" style="color:var(--gold-primary);">${bday.substring(0, 5)}</span></div></div>`;
                    }
                });
                let finalHtml = '';
                if (todayCount > 0) finalHtml += todayHtml;
                if (monthCount > 0) finalHtml += monthHtml;
                if (todayCount + monthCount > 0) {
                    globalBirthdaysCount = todayCount + monthCount; 
                    document.getElementById('list-birthdays').innerHTML = finalHtml;
                    document.getElementById('count-baptism').innerText = currentKidsCount + globalBirthdaysCount;
                } else {
                    document.getElementById('list-birthdays').innerHTML = '<p style="text-align:center; opacity:0.3; margin-top:20px;">Nenhum aniversariante</p>';
                }
            }).catch(e => console.warn(e));
        }
    </script>
