<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Diaconato - Offline</title>
    
    <!-- PWA Styling & Icons -->
    <meta name="theme-color" content="#127369">
    <link rel="icon" type="image/png" href="/assets/logo.png">
    
    <!-- Folha de estilos local sem query string de versão para facilitar o cache do App Shell -->
    <link rel="stylesheet" href="/css/style.css">
    
    <style>
        /* Estilos Críticos Inline: 
           Garantem o visual perfeito da tela de offline mesmo que o style.css
           falhe ao carregar ou ainda não esteja no cache. */
        :root {
            --primary: #127369;
            --primary-dark: #0f5c54;
            --bg-color: #f5f6fa;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-secondary: #666666;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
        }
        .offline-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
        }
        .login-card {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            padding: 2rem;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-sizing: border-box;
        }
        .login-header img {
            width: 80px;
            height: auto;
            margin-bottom: 1rem;
        }
        .login-header h2 {
            margin: 0 0 1.5rem 0;
            font-size: 1.5rem;
            color: var(--text-main);
        }
        .offline-icon {
            display: inline-block;
            margin-bottom: 1.5rem;
        }
        .offline-text {
            color: var(--text-secondary);
            margin-bottom: 2rem;
            font-size: 1.05rem;
            line-height: 1.5;
        }
        .btn-primary {
            background-color: var(--primary);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-primary:hover {
            background-color: var(--primary-dark);
        }
    </style>
</head>
<body>

    <div class="view-container">
        <div class="offline-wrapper">
            <div class="login-card">
                <div class="login-header">
                    <img src="/assets/logo.png" alt="Diaconato Logo">
                    <h2>Sem Conexão</h2>
                </div>
                
                <div class="offline-content">
                    <!-- SVG Inline (Ícone de Wi-Fi cortado, leve e não depende de internet) -->
                    <div class="offline-icon">
                        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="2" y1="2" x2="22" y2="22"></line>
                            <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
                            <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
                            <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
                            <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
                            <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
                            <line x1="12" y1="20" x2="12.01" y2="20"></line>
                        </svg>
                    </div>
                    
                    <p class="offline-text">
                        Não foi possível conectar ao servidor. Verifique sua conexão com a internet e tente novamente.
                    </p>
                    
                    <button class="btn-primary" onclick="location.reload()">
                        <!-- SVG Inline (Ícone de Refresh) -->
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="23 4 23 10 17 10"></polyline>
                            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
                        </svg>
                        Tentar Novamente
                    </button>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
