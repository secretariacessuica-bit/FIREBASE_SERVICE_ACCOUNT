<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Antigravity 2.4 - Unified Mobile v70.3.54 Floating Diamond -->
    <title>Catedral Lausanne | Connect</title>
    
    <link rel="stylesheet" href="css/style-v2.css?v=70.3.54">
    <link rel="stylesheet" href="css/mobile-v2.css?v=70.3.54">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css?v=70.3.54">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;200;400;600;800&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="js/firebase-config.js?v=70.3.54"></script>
    <script src="js/auth-manager.js?v=70.3.54"></script>

    <style>
        :root {
            --gold: #C9A050;
            --gold-dim: rgba(201, 160, 80, 0.1);
            --bg: #000000;
            --text: #e8dcc8;
            --border: rgba(201, 160, 80, 0.2);
            --font: 'Outfit', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        html, body { 
            width: 100%; height: 100%; overflow: hidden;
            background: var(--bg); color: var(--text); font-family: var(--font);
        }

        #view-login {
            position: absolute; inset: 0; z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: var(--bg); padding: 20px;
        }

        .logo-box { width: 150px; height: 150px; margin-bottom: 50px; filter: drop-shadow(0 0 15px rgba(201, 160, 80, 0.3)); }
        .logo-box img { width: 100%; height: 100%; object-fit: contain; }

        .role-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; width: 100%; max-width: 360px; }
        .role-card {
            background: #080808; border: 1px solid var(--border); border-radius: 25px;
            padding: 35px 10px; text-align: center; cursor: pointer; transition: 0.3s;
            display: flex; flex-direction: column; align-items: center; gap: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .role-card i { color: var(--gold); font-size: 1.8rem; }
        .role-card:active { transform: scale(0.95); border-color: var(--gold); background: var(--gold-dim); }
        .role-card span { font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; color: #fff; }
        .role-card.special { 
            grid-column: span 2; border-color: var(--gold); background: var(--gold-dim); 
            padding: 40px 10px; flex-direction: row; justify-content: center; gap: 20px;
        }

        /* PIN SCREEN */
        #pin-screen { display: none; flex-direction: column; align-items: center; justify-content: center; width: 100%; }
        .pin-container {
            background: #080808; border: 1px solid var(--border); border-radius: 30px;
            padding: 50px 30px; width: 100%; max-width: 340px; text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
        }
        .pin-input {
            width: 100%; background: #111; border: 1px solid var(--border);
            border-radius: 15px; padding: 20px; font-size: 2.2rem; text-align: center;
            letter-spacing: 10px; margin-bottom: 30px; outline: none; color: #fff;
        }
        .btn-confirm {
            width: 100%; background: var(--gold); color: #000; border: none;
            padding: 20px; border-radius: 15px; font-weight: 800; font-size: 1.1rem;
            cursor: pointer; text-transform: uppercase; letter-spacing: 2px;
        }

        /* APP HEADER */
        .app-header {
            position: fixed; top: 0; left: 0; width: 100%; height: 70px;
            background: #000; border-bottom: 1.5px solid var(--gold);
            display: none; align-items: center; justify-content: space-between;
            padding: 0 25px; z-index: 1000;
        }
        .app-container { position: absolute; top: 70px; left: 0; width: 100%; height: calc(100% - 70px); display: none; }
        .app-view { display: none; width: 100%; height: 100%; }
        .app-view.active { display: block; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
    <div id="view-login">
        <div id="role-selection">
            <div class="logo-box" style="margin: 0 auto 50px auto;">
                <img src="assets/logo_3.png?v=70.3.43" alt="Logo">
            </div>
            <div class="role-grid">
                <div class="role-card special" onclick="selectRole('altar')">
                    <i class="fas fa-tower-broadcast"></i>
                    <span>LIVE (Altar)</span>
                </div>
                
                <div class="role-card special" onclick="selectRole('admin')" style="margin-top: -5px; background: linear-gradient(135deg, rgba(201, 160, 80, 0.2) 0%, transparent 100%); border-color: var(--gold);">
                    <i class="fas fa-chess-king"></i>
                    <span>Gabinete Pastoral</span>
                </div>

                <div class="role-card" onclick="selectRole('reception')">
                    <i class="fas fa-user-check"></i>
                    <span>Recepção</span>
                </div>
                <div class="role-card" onclick="selectRole('integracao')">
                    <i class="fas fa-heart"></i>
                    <span>Integração</span>
                </div>
                <div class="role-card" onclick="selectRole('kids')">
                    <i class="fas fa-child"></i>
                    <span>Crianças</span>
                </div>
                <div class="role-card" onclick="selectRole('admin')">
                    <i class="fas fa-shield-halved"></i>
                    <span>Secretaria</span>
                </div>
            </div>
        </div>

        <div id="pin-screen">
            <div class="pin-container">
                <h2 style="font-weight: 800; margin-bottom: 30px; letter-spacing: 3px; color: #fff;">ACESSO</h2>
                <input type="password" id="pin-input" class="pin-input" placeholder="••••">
                <div style="display:flex; align-items:center; gap:15px; margin-bottom:30px; justify-content:center; cursor:pointer;" onclick="toggleRemember()">
                    <input type="checkbox" id="remember-me" style="width:24px; height:24px; cursor:pointer; accent-color: var(--gold);">
                    <span style="font-size:1rem; font-weight:600; color:var(--text); letter-spacing:1px;">Manter Conectado</span>
                </div>
                <button class="btn-confirm" onclick="validatePin()">ENTRAR</button>
                <p onclick="showRoles()" style="margin-top:30px; color:var(--gold); font-size:0.85rem; cursor:pointer; font-weight:800; text-transform: uppercase; letter-spacing: 2px;">Voltar</p>
            </div>
        </div>
    </div>

    <header class="app-header" id="app-header">
        <div style="display:flex; align-items:center; gap:15px;">
            <img src="assets/logo_3.png?v=70.3.49" style="height:40px; width:auto;">
        </div>
        <i class="fas fa-power-off" style="color:#FF4444; font-size: 1.4rem;" onclick="logout()"></i>
    </header>

    <div class="app-container" id="app-container">
        <div id="view-reception" class="app-view"><iframe id="iframe-reception" data-src="recepcao.html"></iframe></div>
        <div id="view-kids" class="app-view"><iframe id="iframe-kids" data-src="kids.html"></iframe></div>
        <div id="view-admin" class="app-view"><iframe id="iframe-admin" data-src="admin.html"></iframe></div>
        <div id="view-integracao" class="app-view"><iframe id="iframe-integracao" data-src="integracao.html"></iframe></div>
        <div id="view-altar" class="app-view"><iframe id="iframe-altar" data-src="altar_v3.html"></iframe></div>
    </div>

    <script>
        let currentRole = null;
        const urlParams = new URLSearchParams(window.location.search);
        const roleParam = urlParams.get('role');

        window.onload = () => {
            if(roleParam) {
                selectRole(roleParam);
            }

            setTimeout(() => {
                if(AuthManager.role && AuthManager.role !== 'guest') {
                    const targetRole = roleParam || currentRole;
                    enterApp(targetRole || AuthManager.role);
                }
            }, 1000);
        };

        function selectRole(role) {
            currentRole = role;
            if(role === 'altar') {
                enterApp('altar');
                return;
            }
            document.getElementById('role-selection').style.display='none';
            document.getElementById('pin-screen').style.display='flex';
            document.getElementById('pin-input').value='';
            document.getElementById('pin-input').focus();
        }

        function showRoles() {
            document.getElementById('pin-screen').style.display='none';
            document.getElementById('role-selection').style.display='block';
        }

        async function validatePin() {
            const pin = document.getElementById('pin-input').value.trim();
            if(!pin) return;
            
            const remember = document.getElementById('remember-me').checked;
            const persistence = remember ? firebase.auth.Auth.Persistence.LOCAL : firebase.auth.Auth.Persistence.SESSION;
            await firebase.auth().setPersistence(persistence);

            const res = await AuthManager.login(currentRole, pin);
            if(res.success){
                localStorage.setItem('current_session_pin', pin);
                enterApp(currentRole);
            } else {
                alert("PIN Inválido!");
            }
        }
        function toggleRemember() { document.getElementById('remember-me').checked = !document.getElementById('remember-me').checked; }

        function enterApp(role) {
            localStorage.setItem('session_role', role);
            const pin = localStorage.getItem('current_session_pin');

            document.getElementById('view-login').style.display='none';
            document.getElementById('app-header').style.display='flex';
            document.getElementById('app-container').style.display='block';
            document.querySelectorAll('.app-view').forEach(v => v.classList.remove('active'));
            
            const viewId = 'view-' + role;
            const frameId = 'iframe-' + role;
            if(document.getElementById(viewId)){
                document.getElementById(viewId).classList.add('active');
                const f = document.getElementById(frameId);
                if (f) {
                    if (!f.src) f.src = f.dataset.src + "?v=70.3.55&role=" + role;
                    
                    if(pin === 'Catedral@2025!') {
                        setTimeout(() => {
                            if(f.contentWindow) {
                                f.contentWindow.postMessage({ type: 'MASTER_BYPASS_SIGNAL', pin: pin }, '*');
                                console.log("💎 Master Signal Sent (Mobile) to:", role);
                            }
                        }, 1500);
                    }
                }
            }
            if(role === 'altar') document.getElementById('app-header').style.display='none';
        }

        function logout() { AuthManager.logout(); location.reload(); }
    </script>
    <div class="footer-copyright" style="position:fixed; bottom:15px; width:100%; text-align:center; font-size:0.55rem; color:rgba(201,160,80,0.2); letter-spacing:2px; text-transform:uppercase; pointer-events:none; z-index:10001;">
        © 2026 Wan Hub - Todos os direitos reservados
    </div>
</body>
</html>
