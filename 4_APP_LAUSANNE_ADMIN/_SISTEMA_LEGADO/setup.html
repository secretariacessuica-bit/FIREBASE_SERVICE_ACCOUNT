<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup Inicial | Lausanne</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            background: #f8f9fa;
            font-family: 'Outfit', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #1a1a1a;
        }
        .setup-card {
            background: white;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-width: 400px;
            text-align: center;
        }
        h1 { color: #d4af37; font-weight: 900; margin-bottom: 10px; }
        p { color: #666; margin-bottom: 30px; line-height: 1.5; }
        .btn {
            background: #d4af37;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 12px;
            font-weight: 800;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            transition: 0.3s;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(212,175,55,0.3); }
        #status { margin-top: 20px; font-weight: 600; font-size: 0.9rem; }
        .success { color: #10b981; }
        .error { color: #ef4444; }
    </style>
</head>
<body>

<div class="setup-card">
    <h1>Lausanne System</h1>
    <p>Clique no botão abaixo para configurar seu acesso de <strong>Administrador</strong> no novo banco de dados.</p>
    
    <button class="btn" onclick="runSetup()">CONFIGURAR ADMIN INICIAL</button>
    <div id="status"></div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<!-- Config -->
<script src="js/firebase-config.js"></script>

<script>
    async function runSetup() {
        const statusDiv = document.getElementById('status');
        statusDiv.innerHTML = "Verificando autenticação...";
        
        firebase.auth().onAuthStateChanged(async (user) => {
            if (!user) {
                statusDiv.innerHTML = "<span class='error'>Erro: Você precisa estar logado! <br> Faça login no site e volte aqui.</span>";
                return;
            }

            statusDiv.innerHTML = "Criando registro de Admin para " + user.email + "...";
            
            try {
                await firebase.firestore().collection('users').doc(user.uid).set({
                    email: user.email,
                    role: 'admin',
                    name: 'Admin Inicial',
                    created_at: firebase.firestore.FieldValue.serverTimestamp()
                });
                
                statusDiv.innerHTML = "<span class='success'>✅ SUCESSO! Você agora é Administrador.<br>Redirecionando em 3 segundos...</span>";
                setTimeout(() => {
                    window.location.href = 'admin.html';
                }, 3000);
                
            } catch (error) {
                console.error(error);
                statusDiv.innerHTML = "<span class='error'>Erro: " + error.message + "</span>";
            }
        });
    }
</script>

</body>
</html>
